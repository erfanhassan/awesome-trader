name: Deploy to GCP VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Trigger immediate deploy on VM
        run: |
          gcloud compute ssh awesome-trader \
            --project=trading-shishab \
            --zone=us-central1-a \
            --quiet \
            --ssh-flag="-o StrictHostKeyChecking=no" \
            --command="
              echo '[GitHub Actions] Deployment triggered' >> /var/log/awesome-trader-updater.log
              cd /opt/awesome-trader
              git pull origin main >> /var/log/awesome-trader-updater.log 2>&1
              cd frontend && npm run build >> /var/log/awesome-trader-updater.log 2>&1
              cd /opt/awesome-trader/backend && .venv/bin/pip install -r requirements.txt >> /var/log/awesome-trader-updater.log 2>&1
              sudo systemctl restart awesome-trader
              echo '[GitHub Actions] Restart complete' >> /var/log/awesome-trader-updater.log
            "
